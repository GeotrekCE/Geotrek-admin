# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'frontend/**'
      - '.github/workflows/doc.yml'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - master

    paths-ignore:
      - 'docs/**'
      - 'frontend/**'
      - '.github/workflows/doc.yml'
      - '.github/workflows/frontend.yml'
  release:
    types:
      - created

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  POSTGRES_DB: ci_test
  POSTGRES_PASSWORD: ci_test
  POSTGRES_USER: ci_test
  POSTGRES_HOST: 127.0.0.1
  SERVER_NAME: geotrek.local
  SECRET_KEY: test-test-test
  CONVERSION_HOST: localhost
  CAPTURE_HOST: localhost
  REDIS_HOST: 127.0.0.1
  VAR_DIR: /home/runner/work/Geotrek-admin/Geotrek-admin/var
  LANG: C.UTF-8
  LANGUAGES: en fr
  LANGUAGE_CODE: en
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  PYTHONWARNINGS: ignore

jobs:
  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get frontend git cache key
        id: get-key
        run: |
          echo "FRONTEND_CACHE_KEY=$(git --no-pager log -1 --format="%H" -- frontend/)" >> $GITHUB_OUTPUT

      - name: Cache frontend
        id: cache-frontend
        uses: actions/cache@v6
        with:
          path: ./frontend/dist
          key: frontend-${{ steps.get-key.outputs.FRONTEND_CACHE_KEY }}

      - name: Setup node for frontend
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: './frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install frontend dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: |
          npm ci --no-audit

      - name: Build frontend
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: |
          cp .env.dist .env
          sed -i 's|HOST_URL=.*|HOST_URL=/|' .env
          npm run build

  test:
    name: Python Unittests
    runs-on: ${{ matrix.os }}

    permissions:
      packages: write  # required to publish docker image

    strategy:
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-26.04']
        tests-env: ['tests', 'tests_nds']

    env:
      ENV: ${{ matrix.tests-env }}
      OS: ${{ matrix.os }}
      POSTGRES_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1

    services:
      postgres:
        image: pgrouting/pgrouting:14-3.5-3.7
        env:
          POSTGRES_DB: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_USER: ci_test
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
      redis:
        image: redis:5.0-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Prepare test env
      run: |
        sudo apt-get update -q
        sudo apt-get -qq -y install \
           unzip \
           gettext \
           binutils \
           libproj-dev \
           gdal-bin \
           sudo \
           less \
           curl \
           git \
           iproute2 \
           software-properties-common \
           shared-mime-info \
           fonts-liberation \
           libssl-dev \
           libfreetype6-dev \
           libxml2-dev \
           libxslt-dev \
           libpangocairo-1.0-0 \
           libgdk-pixbuf-2.0-dev \
           libffi-dev \
           libvips
        sudo apt-get install -y --no-install-recommends postgis

    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        python-version: 3.13
        enable-cache: true
        activate-environment: true

    - name: Install python dependencies
      run: |
        uv pip sync requirements.txt requirements-dev.txt

    - name: Create test required directories
      run: |
        mkdir -p ./var/log ./var/cache/sessions

    - name: Prepare environment
      run: |
        mkdir -p $VAR_DIR/conf/extra_static $VAR_DIR/tmp
        python manage.py collectstatic --clear --noinput --verbosity=0
        python manage.py compilemessages

    - name: Check missing migrations
      run: |
        ENV=dev python ./manage.py makemigrations --check

    - name: Check running migrations
      run: |
        ENV=dev python ./manage.py migrate

    - name: Launch Celery
      run: |
        celery -A geotrek worker -c 1 &

    - name: Unit test
      run: |
        coverage run --parallel-mode --concurrency=multiprocessing ./manage.py test --parallel -v 3
        coverage combine
        coverage xml -o coverage.xml

    - name: Save coverage
      uses: actions/upload-artifact@v7
      with:
        name: coverage_${{ matrix.os }}_${{ matrix.tests-env }}
        path: coverage.xml

    - uses: codecov/codecov-action@v7
      with:
          files: ./coverage.xml
          env_vars: OS,ENV
          token: ${{ secrets.CODECOV_TOKEN }} # not usually required for public repos
          fail_ci_if_error: true # optional (default = false)

  build_docker_image:
    name: Build docker image
    runs-on: ubuntu-latest
    needs: [ build_frontend ]
    steps:
      - uses: actions/checkout@v7

      - name: Get frontend git cache key
        id: get-key
        run: |
          echo "FRONTEND_CACHE_KEY=$(git --no-pager log -1 --format="%H" -- frontend/)" >> $GITHUB_OUTPUT

      - name: Cache frontend
        uses: actions/cache@v6
        with:
          path: ./frontend/dist
          key: frontend-${{ steps.get-key.outputs.FRONTEND_CACHE_KEY }}

      - name: Prepare frontend build context
        run: |
          mkdir -p tmp_frontend/frontend
          cp -r frontend/dist tmp_frontend/frontend/

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
            push: false
            builder: ${{ steps.buildx.outputs.name }}
            tags: "geotrek:latest"
            load: true
            file: ./docker/Dockerfile
            build-args: |
              FRONTEND_IMAGE=geotrek_frontend
            build-contexts: |
              geotrek_frontend=./tmp_frontend

      - name: Upload image
        uses: ishworkh/container-image-artifact-upload@v2.0.0
        with:
          image: "geotrek:latest"

  build_deb:
      name: Build debian package
      runs-on: ubuntu-latest
      needs: [ build_frontend ]

      steps:
          - uses: actions/checkout@v7

          - name: Get frontend git cache key
            id: get-key
            run: |
              echo "FRONTEND_CACHE_KEY=$(git --no-pager log -1 --format="%H" -- frontend/)" >> $GITHUB_OUTPUT

          - name: Cache frontend
            uses: actions/cache@v6
            with:
              path: ./frontend/dist
              key: frontend-${{ steps.get-key.outputs.FRONTEND_CACHE_KEY }}

          - name: Prepare versioning
            run: |
                grep '^[0-9]\+\.[0-9]\+\.[0-9]\+$' VERSION || sed -i 's/+dev/.~dev'$GITHUB_RUN_ID'/' debian/changelog
                sed -i 's/geotrek-admin (\([0-9]\+\.[0-9]\+\.[0-9]\+\)\(.*\)) RELEASED;/geotrek-admin (\1.'amd64'\2) debian;/' debian/changelog

          - name: Building package
            run: |
              docker build -t geotrek-deb-builder -f docker/build-deb/Dockerfile .
              docker run --rm -v "./:/workspace" -e DEB_VERSION="$(cat VERSION)" geotrek-deb-builder
              cp *.deb /home/runner/work/Geotrek-admin/

          - name: Archive package artifact
            uses: actions/upload-artifact@v7
            with:
              name: debian-package
              path: |
                /home/runner/work/Geotrek-admin/*.deb

  e2e_docker_image:
    name: Tests E2E docker
    runs-on: ubuntu-latest
    needs: [build_docker_image]
    env:
      CYPRESS_BASE_URL: http://geotrek.local
      CYPRESS_CACHE_FOLDER: ~/cypress/cache

    services:
      postgres:
        image: pgrouting/pgrouting:14-3.5-3.7
        env:
          POSTGRES_DB: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_USER: ci_test
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
        volumes:
          - postgres:/var/lib/postgresql/data

    steps:
      - uses: actions/checkout@v7

      - name: Download image
        uses: ishworkh/container-image-artifact-download@v2.1.0
        with:
          image: "geotrek:latest"

      - name: Launch service
        run: |
          sudo systemctl stop apache2
          sudo systemctl stop nginx
          docker tag geotrek:latest geotrekce/admin:latest
          cp docker/install/.env.dist .env
          cp docker/install/docker-compose.yml docker-compose.yml
          cp cypress/docker-compose-cypress.yml docker-compose-cypress.yml
          sudo sed -i 's/UID=/UID="$UID"/' .env
          sudo sed -i 's/GID=/GID="$GID"/' .env
          sudo sed -i 's/localhost/geotrek.local/' .env
          echo 'LANGUAGES=en fr' >> .env
          echo 'LANGUAGE_CODE=en' >> .env
          sudo sed -i 's/127.0.0.1 localhost/127.0.0.1 localhost geotrek.local/' /etc/hosts
          mkdir -p var/conf/extra_static
          cp cypress/custom.py var/conf/custom.py
          echo 'POSTGRES_USER=ci_test' >> .env
          echo 'POSTGRES_PASSWORD=ci_test' >> .env
          echo 'POSTGRES_DB=ci_test' >> .env
          docker compose run web update.sh
          make load_data
          make load_test_integration
          COMPOSE_FILE=docker-compose.yml:docker-compose-cypress.yml docker compose up -d

      - name: install Cypress
        run: |
          cd /home/runner/work/Geotrek-admin/Geotrek-admin/cypress
          npm ci
          npm list
          echo "Waiting for container..."
          while ! nc -z "127.0.0.1" "80"; do
            sleep 0.1
          done

      - name: Check DEM scripts are available in docker image
        run: |
          docker compose run --rm web sh -c 'command -v raster2pgsql >/dev/null 2>&1 || { echo >&2 "raster2pgsql command not found."; exit 1; }'

      - name: E2E test
        run: |
          /home/runner/work/Geotrek-admin/Geotrek-admin/cypress/node_modules/.bin/cypress run -P /home/runner/work/Geotrek-admin/Geotrek-admin/cypress --record --key 64a5a9b3-9869-4a2f-91e4-e3cd27c2f564
        continue-on-error: false

      - name: Archive results as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cypress-docker
          path: |
            /home/runner/work/Geotrek-admin/Geotrek-admin/cypress/videos/*.mp4
            /home/runner/work/Geotrek-admin/Geotrek-admin/cypress/screenshots/*.png

  e2e_deb:
    name: Tests E2E debian package
    runs-on: ubuntu-${{ matrix.code }}
    needs: [ build_deb ]
    strategy:
      matrix:
          os: ['jammy', 'noble', 'resolute']
          include:
              - os: 'jammy'
                code: '22.04'
              - os: 'noble'
                code: '24.04'
              - os: 'resolute'
                code: '26.04'
    env:
      CYPRESS_BASE_URL: http://geotrek.local
      CYPRESS_CACHE_FOLDER: ~/cypress/cache

    services:
      postgres:
        image: pgrouting/pgrouting:14-3.5-3.7
        env:
          POSTGRES_DB: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_USER: ci_test
        ports:
          - 5432:5432
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready

    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: debian-package

      - name: Simulate install.sh procedure
        run: |
          sudo systemctl stop apache2 2>/dev/null || true
          sudo systemctl disable --now apache2 2>/dev/null || true
          sudo fuser -k 80/tcp 2>/dev/null || true
          sudo cp tools/geotrek.sources /etc/apt/sources.list.d/geotrek.sources
          sudo curl -o /etc/apt/keyrings/apt.geotrek.gpg --fail https://packages.geotrek.fr/geotrek.gpg
          sudo apt-get -q update
          echo "geotrek-admin geotrek-admin/MANAGE_DB boolean false" >> .debian_settings
          echo "geotrek-admin geotrek-admin/POSTGRES_HOST string $POSTGRES_HOST" >> .debian_settings
          echo "geotrek-admin geotrek-admin/TIME_ZONE string Europe/Paris" >> .debian_settings
          echo "geotrek-admin geotrek-admin/LANGUAGES string en fr" >> .debian_settings
          echo "geotrek-admin geotrek-admin/POSTGRES_USER string $POSTGRES_USER" >> .debian_settings
          echo "geotrek-admin geotrek-admin/POSTGRES_DB string $POSTGRES_DB" >> .debian_settings
          echo "geotrek-admin geotrek-admin/POSTGRES_PASSWORD string $POSTGRES_PASSWORD" >> .debian_settings
          echo "geotrek-admin geotrek-admin/SERVER_NAME string geotrek.local" >> .debian_settings
          mkdir -p /opt/geotrek-admin/var/conf/
          cp /home/runner/work/Geotrek-admin/Geotrek-admin/cypress/custom.py /opt/geotrek-admin/var/conf/custom.py
          sudo sed -i 's/127.0.0.1 localhost/127.0.0.1 localhost geotrek.local/' /etc/hosts
          sudo debconf-set-selections .debian_settings

      - name: Install package
        run: |
          sudo apt-get install -y --no-install-recommends /home/runner/work/Geotrek-admin/Geotrek-admin/*.deb
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo systemctl restart redis-server memcached geotrek-ui geotrek-api geotrek-celery nginx

      - name: Load Data
        run: |
          sudo geotrek loaddata minimal
          sudo geotrek loaddata cirkwi
          sudo geotrek loaddata basic
          sudo geotrek loaddata test-integration
          for dir in `ls -d /opt/geotrek-admin/lib/python3*/site-packages/geotrek/*/fixtures/upload`; do
          	cd $dir > /dev/null
          	sudo cp -r * /opt/geotrek-admin/var/media/upload/
          done
          sudo chown -R geotrek:geotrek /opt/geotrek-admin/var

      - name: Wait for Geotrek to be ready
        run: |
          echo "Waiting for Geotrek on port 80..."
          timeout 60 bash -c 'until curl -sf -H "Host: geotrek.local" http://127.0.0.1/ >/dev/null; do sleep 1; done' || {
            echo "=== Erreur : Geotrek ne répond pas sur le port 80 ==="
            echo "--- Statut des services systemd ---"
            sudo systemctl status nginx geotrek-ui geotrek-api geotrek redis-server memcached --no-pager || true
            echo "--- Logs Nginx ---"
            sudo cat /var/log/nginx/error.log /var/log/nginx/geotrek_error.log || true
            echo "--- Logs Gunicorn (Geotrek UI) ---"
            sudo journalctl -u geotrek-ui -n 50 --no-pager || true
            echo "--- Test Curl direct ---"
            curl -v -H "Host: geotrek.local" http://127.0.0.1/ || true
            exit 1
          }

      - name: Install cypress
        run: |
          cd /home/runner/work/Geotrek-admin/Geotrek-admin/cypress
          npm ci
          npm list

      - name: E2E test
        run: |
          /home/runner/work/Geotrek-admin/Geotrek-admin/cypress/node_modules/.bin/cypress run -P /home/runner/work/Geotrek-admin/Geotrek-admin/cypress --record --key 64a5a9b3-9869-4a2f-91e4-e3cd27c2f564
        continue-on-error: false

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== Geotrek UI logs ==="
          sudo journalctl -u geotrek-ui -n 200 --no-pager || true
          echo "=== Geotrek Log File ==="
          sudo cat /opt/geotrek-admin/var/log/geotrek.log || true
          echo "=== Nginx Geotrek Error Log ==="
          sudo cat /var/log/nginx/geotrek_error.log || true
          echo "=== Nginx Error Log ==="
          sudo cat /var/log/nginx/error.log || true

      - name: Archive results as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cypress-${{ matrix.code }}
          path: |
            /home/runner/work/Geotrek-admin/Geotrek-admin/cypress/videos/*.mp4
            /home/runner/work/Geotrek-admin/Geotrek-admin/cypress/screenshots/*.png

  deploy:
    name: Publish (on release only)
    runs-on: ubuntu-latest
    needs: [ test, e2e_docker_image, build_deb, e2e_deb ]
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Get frontend git cache key
        id: get-key
        run: |
          echo "FRONTEND_CACHE_KEY=$(git --no-pager log -1 --format="%H" -- frontend/)" >> $GITHUB_OUTPUT

      - name: Cache frontend
        uses: actions/cache@v6
        with:
          path: ./frontend/dist
          key: frontend-${{ steps.get-key.outputs.FRONTEND_CACHE_KEY }}

      - name: Prepare frontend build context
        run: |
          mkdir -p tmp_frontend/frontend
          cp -r frontend/dist tmp_frontend/frontend/

      - name: Download 22.04 debian artifact
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        uses: actions/download-artifact@v8
        with:
          name: jammy

      - name: Download 24.04 debian artifact
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        uses: actions/download-artifact@v8
        with:
          name: noble

      - name: Download docker image
        uses: ishworkh/container-image-artifact-download@v2.1.0
        with:
          image: 'geotrek:latest'

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images:  |
            geotrekce/admin
            ghcr.io/geotrekce/geotrek-admin

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          push: true
          provenance: mode=max
          sbom: true
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.meta.outputs.tags }}
          file: ./docker/Dockerfile
          build-args: |
            FRONTEND_IMAGE=geotrek_frontend
          build-contexts: |
            geotrek_frontend=./tmp_frontend

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Publish debian packages
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        run: |
          if [[ "${{ github.ref }}" == *"dev"* ]]; then
            export DEB_COMPONENT=dev
          else
            export DEB_COMPONENT=main
          fi
          echo "${{ github.ref }} : Publishing as $DEB_COMPONENT package"
          scp -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no /home/runner/work/Geotrek-admin/Geotrek-admin/geotrek-admin_*_amd64.deb ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/packages/incoming/$DEB_COMPONENT/
          if [[ "${{ github.ref }}" == *"dev"* ]]; then
            ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} make debian_dev -C /srv/packages
          else
            ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} make debian_main -C /srv/packages
          fi

      - name: Upload assets to release
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        run: gh release upload "${{ github.ref_name }}" *.deb --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare install-docker.zip
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        run: |
          cd docker/install
          mkdir -p geotrek/var
          cp * ./geotrek 2>/dev/null || :
          zip -r ../../install-docker.zip geotrek/

      - name: Attach zip archive as release binary
        if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
        run: gh release upload "${{ github.ref_name }}" *.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
