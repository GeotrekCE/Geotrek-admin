upstream api {
    server api:8000;
}

upstream web {
    server web:8000;
}

map $uri $pdf_limit_key {
    default "";
    ~*\.pdf$ $server_name;
}

limit_conn_zone $pdf_limit_key zone=pdf_concurrency:10m;

map $http_origin $allow_origin {
    "~${RANDO_SERVER_NAME_PIPE}" $http_origin;
    default "";
}

map $http_user_agent $is_indexer {
    default 0;
    ~*(bot|crawler|spider|slurp|meta-externalagent|meta-webindexer|facebookexternalhit|Bytespider|Amazonbot|RiverBot|Brightbot|PetalBot|DotBot|MJ12bot|SemrushBot|AhrefsBot|Baiduspider|GoogleOther|GiantCrawler|SeznamBot|ia_archiver) 1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  4;
    gzip_types       application/json application/geo+json;

    client_max_body_size 200M;

    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header Host               $http_host;
    proxy_redirect   off;
    keepalive_timeout 0;

    proxy_buffer_size       128k;
    proxy_buffers           8 512k;
    proxy_busy_buffers_size 512k;

    proxy_read_timeout 600s;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /media/\nDisallow: /\n";
    }

    location ~* ^/api/.*\.(pdf|kml|gpx)$ {
        if ($is_indexer) { return 403; }

        limit_conn pdf_concurrency 2;
        limit_conn_status 503;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Access-Control-Allow-Origin $allow_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_read_timeout 120s;
        proxy_pass http://api;
    }

    location ~ ^/api {
        if ($is_indexer) {
            return 403;
        }

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Access-Control-Allow-Origin $allow_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_read_timeout 60s;
        proxy_pass http://api;
    }

    location /media {
        expires 1d;
        alias /opt/geotrek-admin/var/media/;
        add_header Access-Control-Allow-Origin $allow_origin;
    }

    location /media_secure {
        internal;
        expires 1d;
        alias /opt/geotrek-admin/var/media;
    }

    location /static {
        expires 1d;
        alias /opt/geotrek-admin/var/static/;
    }

    location ~ ^/m/(?<remaining_path>.*)$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        root /;
        try_files /opt/geotrek-admin/var/frontend/dist/$remaining_path /opt/geotrek-admin/var/frontend/dist/index.html =404;
    }

    location ^~ /m/sw.js {
        alias /opt/geotrek-admin/var/frontend/dist/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        access_log off;
    }

    location = /m {
        return 307 /m/;
    }

    location ~ ^/mobile/(.*)$ {
        if ($is_indexer) {
            return 403;
        }

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Vary "Accept-Language";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        root /opt/geotrek-admin/var/mobile/;
        try_files /$http_accept_language/$1 /nolang/$1 =404;
        gzip on;
        gzip_types text/text text/plain text/xml text/css application/x-javascript application/javascript application/json;
        include mime.types;
        types {
            application/json geojson;
            application/gpx+xml gpx;
            application/x-font-ttf ttf;
        }
    }

    try_files $uri @django;

    location @django {
        if ($is_indexer) {
            return 403;
        }

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://web;
    }
}